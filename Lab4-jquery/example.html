<!DOCTYPE html>
<html>
  <head>
    <title>jQuery - Practice</title>
    <link rel="stylesheet" href="css/styles.css" />    
    <script src="js/jquery-1.11.0.js"></script>        
    <script src="js/example.js"></script>
  </head>
  <body>
    <div id="page">
      <h1 id="header"><img src="images/game-controller.png" alt="game-controller"></h1>
      
      <h2>My Games <span id="counter"></span></h2>
      
      <ul id="gameList">
        <li>The Legend of Zelda: Breath of the Wild</li>
        <li>God of War Ragnarök</li>
        <li>Halo Infinite</li>
        <li>Minecraft</li>
        <li>Super Mario Odyssey</li>
      </ul>

      <div id="newItemButton">
        <button href="#" id="showForm">Add new</button>
      </div>
      
      <form id="newItemForm">
        <input type="text" id="itemDescription" placeholder="Add description" />
        <input type="submit" id="add" value="add" />
      </form>

    </div>

  </body>
</html>
